configuration:
  log_level:
    name: Уровень логирования
    description: "info — логировать только запуск/остановку и ошибки. debug — дополнительно логировать каждый запрос с его client_id, методом и путём. Удобно, чтобы различать аккаунты в логах и отлаживать проблемы синхронизации."
  accounts:
    name: Аккаунты
    description: Одна запись на каждый независимый аккаунт Brave Sync. Каждый включённый аккаунт запускается как отдельный полностью изолированный процесс сервера — со своим портом и своим файлом базы данных SQLite.
    fields:
      name:
        name: Имя аккаунта
        description: Человекочитаемое имя аккаунта (например «Личный», «Рабочий»). Используется для имени файла базы данных этого аккаунта и как префикс в логах, например «[User 1] sync-lite listening on :8295 ...».
      enabled:
        name: Включён
        description: Запускать ли серверный процесс для этого аккаунта.
      port:
        name: Порт
        description: TCP-порт, на котором слушает сервер этого аккаунта. Должен быть уникален среди аккаунтов и совпадать с записью в разделе «Сеть» (ports) конфигурации аддона. Именно этот порт нужно указать во флаге Brave #brave-override-sync-server-url для данного аккаунта.
      ssl:
        name: Включить SSL
        description: Обслуживать этот аккаунт по HTTPS, используя сертификат/ключ ниже.
      certfile:
        name: Файл сертификата
        description: Имя файла сертификата внутри /ssl, используется только если для этого аккаунта включён SSL.
      keyfile:
        name: Файл ключа
        description: Имя файла приватного ключа внутри /ssl, используется только если для этого аккаунта включён SSL.
      blocked_client_ids:
        name: Заблокированные client_id
        description: Список client_id через запятую, которые нужно заблокировать для этого аккаунта (их цепочка синхронизации будет помечена как отключённая администратором).
      high_device_limit_client_ids:
        name: client_id с повышенным лимитом устройств
        description: Список client_id через запятую, для которых для этого аккаунта повышен лимит устройств.
